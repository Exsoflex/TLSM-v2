[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tlsm"
version = "0.2.0"
description = "Traductor de Lengua de Señas Mexicana (LSM) con visión por computadora"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "TLSM contributors" }]
keywords = ["LSM", "lengua de senas", "sign language", "mediapipe", "openCV"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Operating System :: Microsoft :: Windows",
]

# Dependencias directas. Las versiones exactas reproducibles están en requirements.lock.txt
dependencies = [
  "mediapipe>=1.2,<2",
  "opencv-contrib-python>=5.1,<6",
  "numpy>=2.4,<3",
  "pandas>=3.1,<4",
  "scikit-learn>=1.9,<2",
  "joblib>=1.6,<2",
  "matplotlib>=3.11,<4",
  "pyttsx3>=2.99,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9"]
speech = ["faster-whisper>=1.2,<2", "piper-tts>=1.8,<2"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
